<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><strong>PomoSci</strong></title>

    <head>

    <body>
        <!-- ======== HTML ======== -->
        <div class="lab_sci">
            <h1>Welcome to PomoSci</h1>
            <p id="mode">Time to <strong>LOCK IN</strong></p>

            <div class="beaker is paused" id="beaker">
                <div id="liquid">
                    <span class="bubble"></span>
                    <span class="bubble"></span>
                    <span class="bubble"></span>
                    <span class="bubble"></span>
                </div>
            </div>
            <div id="time">25:00</div>
            <button onclick="start()">Start</button>
            <button onclick="pause()">Pause</button>
            <button onclick="reset()">Reset</button>

            <p id="fact">Finish atleast one focus session to unlock a science FACT of the DAY!</p>
            <p id="count">Sessions Completed: 0</p>

            <!-- ====Css--===-->

            <style>
                body {
                    font-family: Comic Sans MS, Comic Sans, cursive;
                    background-color: rgb(4, 108, 188);
                    text-align: center;
                }

                .lab_sci {
                    background-color: rgb(195, 225, 253);
                    width: 1454px;
                    margin: 50px auto;
                    padding: 25px;
                    border: 3px solid black;
                    border-radius: 22px;
                }

                h1 {
                    color: rgb(44, 113, 166);
                }

                #mode {
                    color: green;
                    font-size: 18px;
                }

                .beaker {
                    width: 122px;
                    height: 190px;
                    margin: 25px auto;
                    border: 3px solid black;
                    border-top: none;
                    position: relative;
                }

                #liquid {
                    background-color: rgb(160, 255, 160);
                    height: 100%;
                    position: absolute;
                    bottom: 0;
                    width: 100%;
                }

                #time {
                    font-size: 44px;
                    font-weight: bold;
                    margin: 18px;
                    font-family: 'Comic Sans MS', cursive, sans-serif;
                }

                button {
                    background-color: rgb(14, 118, 14);
                    color: white;
                    padding: 10px 20px 10px;
                    font-size: 16px;
                    border: none;
                    border-radius: 6.7px;
                }

                button:hover {
                    background-color: rgb(132, 212, 132);
                    color: rgb(30, 30, 30);
                    cursor: pointer;
                    border: 4.5px solid rgb(55, 0, 0);
                }
