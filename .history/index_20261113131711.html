    <body>
        <!-- ======== HTML ======== -->
        <div class="lab_sci">
            <h1>Welcome to PomoSci</h1>
            <p id="mode">Time to <strong>Focus</strong></p>

            <div class="beaker is paused" id="beaker">
                <div id="liquid">
                    <span class="bubble"></span>
                    <span class="bubble"></span>
                    <span class="bubble"></span>
                    <span class="bubble"></span>
                </div>
            </div>
            <div id="time">25:00</div>
            <button onclick="start()">Start</button>
            <button onclick="pause()">Pause</button>
            <button onclick="reset()">Reset</button>

            <p id="fact">Finish atleast one focus session to unlock a science FACT of the DAY!</p>
            <p id="count">Experiments Completed: 0</p>

            <!-- ====Css--===-->

            <style>
                body {
                    font-family: Comic Sans MS, Comic Sans, cursive;
                    background-color: rgb(9, 128, 219);
                    text-align: center;
                }

                .lab_sci {
                    background-color: rgb(200, 223, 244);
                    width: 1454px;
                    margin: 50px auto;
                    padding: 25px;
                    border: 3px solid black;
                    border-radius: 22px;
                }
