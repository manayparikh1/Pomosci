            <script>

                const breakTime = 5 * 60; // 5 minutes in seconds : which is 300 seconds
                let timeLeft = timingoftheFocus;
                let totalTime = timingoftheFocus;
                let overallOn = false;
                let timer = null; // timer starts at the full time (25min)
                let completedSessions = 0; // initial completing session

                const facts = [

                    "Sound travels approximately 4 times faster in water than in air.",

                    "The largest volcano ever is not even on Earth...it is on MARS! called Olympus Mons.",
                    "Waters boiling point is 100 C and it's freezing point is 0 C.",
                ];
                // MODULUS will be used, like in python to get the hiehgt of beaker
                function updateScreen() {
                    let sec = timeLeft % 60; // uses the modulus operator to get the seconds left 
                    if (sec < 10)
                        sec = "0" + sec; // adds a zero to the front if its less that 10
                    // this wil basically update the time that is on the screen to show time left in min
                    document.getElementById("time").textContent = Math.floor(timeLeft / 60 + ":" + sec);
                    document.getElementById("liquid").style.height = (timeLeft / totalTime) * 100 + "%"; // modulus operator for height of beaker 
                }
                // runs every second
                function tick() {
                    if (timeleft > 0) {
                        timeLeft--;
                        updateScreen();
                    }
                    else {
                        // BREAK TIME HERES A FACT basically the msg i wrote in the html it will print
                        pause();
                        document.getElementById("mode").textContent = "It is time to take a ... BREAK!!!";
                        // imports math library to give random fact from the array i created
                        document.getElementById("fact").textContent = facts[Math.floor(Math.random() * facts.length)];
                    }
                }

            </script>
